<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>My App | قصص وروايات</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
font-family:Arial,sans-serif;
color:white;
text-align:center;
background:linear-gradient(135deg,#090d18,#202b43,#111827);
}

.card{
width:100%;
max-width:430px;
padding:30px 22px;
border:1px solid #d8ad4b55;
border-radius:25px;
background:#ffffff0d;
box-shadow:0 15px 50px #0008;
}

.logo{
width:190px;
max-width:100%;
border-radius:22px;
margin-bottom:15px;
}

h1{
font-size:34px;
margin:10px;
color:#f5c75e;
}

p{
line-height:2;
color:#e1e6ef;
}

.download,.share{
display:block;
width:100%;
margin-top:18px;
padding:17px;
border-radius:14px;
font-size:19px;
font-weight:bold;
text-decoration:none;
cursor:pointer;
}

.download{
background:linear-gradient(90deg,#d99e25,#ffdc79);
color:#17120a;
border:0;
}

.share{
background:#187b55;
color:white;
border:0;
}

.counter{
margin-top:18px;
padding:16px;
border:1px solid #d8ad4b55;
border-radius:15px;
background:#0003;
}

.counter-title{
color:#e1e6ef;
font-size:15px;
}

.counter-number{
font-size:32px;
font-weight:bold;
color:#f5c75e;
margin-top:8px;
}

.counter-note{
font-size:11px;
color:#8995a8;
margin-top:5px;
}

.info{
margin-top:22px;
color:#c3cbd9;
font-size:14px;
line-height:2;
}

.footer{
margin-top:25px;
font-size:12px;
color:#8995a8;
}
</style>
</head>

<body>

<div class="card">

<img class="logo"
src="file_00000000438c8210900b36ff5dc5fda9.png"
alt="My App">

<h1>My App</h1>

<p>
عالم من القصص والروايات بين يديك 📚
<br>
اكتشف أجمل القصص واستمتع بتجربة قراءة مميزة.
</p>

<a class="download" id="downloadBtn"
href="https://github.com/Alaaoo0/my-app-download/releases/download/v1.0.0/my_app__v1.0.0.APK">
⬇ تحميل التطبيق الآن
</a>

<!-- عداد الزيارات -->
<div class="counter">
<div class="counter-title">👁️ إجمالي زيارات الموقع</div>
<div class="counter-number" id="visitCount">...</div>
<div class="counter-note">عدد مرات فتح صفحة الموقع</div>
</div>

<!-- عداد التحميلات -->
<div class="counter">
<div class="counter-title">📥 إجمالي ضغطات التحميل</div>
<div class="counter-number" id="downloadCount">...</div>
<div class="counter-note">عدد مرات الضغط على زر التحميل</div>
</div>

<button class="share" onclick="shareApp()">
📤 مشاركة التطبيق
</button>

<div class="info">
الإصدار 1.0.0
<br>
Android | الحجم 8.85 MB
</div>

<div class="footer">
© 2026 My App - جميع الحقوق محفوظة
</div>

</div>

<script>

const COUNTER_URL =
"https://countapi.mileshilliard.com/api/v1/";

const DOWNLOAD_KEY =
"my_app_downloads_alaaoo0";

const VISIT_KEY =
"my_app_page_views_alaaoo0";


// تحديث عداد التحميلات
async function updateDownloadCounter(){

const display =
document.getElementById("downloadCount");

try{

const response = await fetch(
COUNTER_URL + "get/" + DOWNLOAD_KEY
);

if(!response.ok) throw new Error("Counter unavailable");

const data = await response.json();

if(data.error) throw new Error(data.error);

display.textContent =
Number(data.value).toLocaleString("en-US");

}catch(error){

display.textContent = "غير متاح حالياً";
console.error(error);

}

}


// تسجيل زيارة الموقع
async function trackVisit(){

const display =
document.getElementById("visitCount");

try{

const response = await fetch(
COUNTER_URL + "hit/" + VISIT_KEY
);

if(!response.ok) throw new Error("Visit counter failed");

const data = await response.json();

if(data.error) throw new Error(data.error);

display.textContent =
Number(data.value).toLocaleString("en-US");

}catch(error){

display.textContent = "غير متاح حالياً";
console.error(error);

}

}


// زيادة عداد التحميل عند الضغط
document.getElementById("downloadBtn")
.addEventListener("click",async function(event){

event.preventDefault();

const downloadUrl = this.href;

this.textContent = "⏳ جاري تجهيز التحميل...";
this.style.pointerEvents = "none";

try{

const response = await fetch(
COUNTER_URL + "hit/" + DOWNLOAD_KEY
);

if(!response.ok) throw new Error("Counter failed");

const data = await response.json();

if(data.error) throw new Error(data.error);

document.getElementById("downloadCount").textContent =
Number(data.value).toLocaleString("en-US");

}catch(error){

console.error("Counter error:",error);

}

// الانتقال إلى رابط تحميل التطبيق
window.location.href = downloadUrl;

});


// مشاركة التطبيق
async function shareApp(){

const shareData={
title:"My App - قصص وروايات",
text:"حمّل تطبيق My App واستمتع بأجمل القصص والروايات 📚",
url:"https://alaaoo0.github.io/my-app-download/"
};

try{

if(navigator.share){

await navigator.share(shareData);

}else{

await navigator.clipboard.writeText(shareData.url);
alert("تم نسخ رابط التطبيق بنجاح");

}

}catch(error){

if(error.name!=="AbortError"){
alert("تعذرت المشاركة، حاول مرة ثانية");
}

}

}


// تشغيل العدادات
trackVisit();
updateDownloadCounter();

</script>

</body>
</html>
